services:
  bot:
    build: .
    env_file: .env
    volumes:
      # Сохранение фидбека между перезапусками
      - ./feedback:/app/feedback
      # Сохранение отчётов
      - ./reports:/app/reports
      # База данных (магазины, настройки)
      - ./data:/app/data
      # Логи бота
      - ./logs:/app/logs
    restart: unless-stopped
    stop_grace_period: 10s
    environment:
      - FEEDBACK_DIR=/app/feedback
      - REPORTS_DIR=/app/reports
      - DB_PATH=/app/data/bot.db
      - LOGS_DIR=/app/logs
